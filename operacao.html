<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operação - Central Boni</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#0d0d10;color:#f4f4f5;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:#18181c}
h1{margin:0;font-size:28px}#relogio{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
main{flex:1;padding:22px 28px;display:grid;gap:20px;grid-template-rows:auto auto auto 1fr}
.plats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pl{background:#1c1c21;border-radius:14px;padding:16px 20px;border-top:10px solid #555}.pl h3{margin:0 0 6px;font-size:24px;letter-spacing:.5px}.pl b{font-size:84px;line-height:1;font-variant-numeric:tabular-nums}.pl span{display:block;font-size:20px;color:#a1a1aa;margin-top:6px}.pl.ok b{color:#4ade80}
.pl .lin{display:flex;align-items:center;gap:18px}.pl .tipos{display:flex;flex-direction:column;gap:6px;font-size:22px;font-weight:700}
.pl .tipos i{font-style:normal;padding:4px 12px;border-radius:8px;white-space:nowrap}.pl .tipos .p{background:#3b1d5c;color:#e9d5ff}.pl .tipos .s{background:#1f3a2a;color:#bbf7d0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.k{background:#1c1c21;border-radius:14px;padding:18px 20px}.k b{display:block;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}.k span{font-size:20px;color:#a1a1aa}
.bar{height:34px;background:#26262c;border-radius:10px;overflow:hidden;display:flex}
.bar div{height:100%;transition:width .6s}
.prev{font-size:30px;text-align:center}.prev b{font-size:44px;color:#4ade80}
table{width:100%;border-collapse:collapse;font-size:24px}th,td{padding:10px 12px;text-align:center;border-bottom:1px solid #2e2e33}th{color:#a1a1aa;font-weight:600}td:first-child,th:first-child{text-align:left}
#pausa{display:none;padding:12px;background:#3b2f00;color:#ffd84d;font-size:28px;font-weight:800;text-align:center}
#alarme{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;font-size:80px;font-weight:900;background:#d7263d;text-align:center}
#alarme.on{display:flex;animation:p .5s steps(1) infinite}@keyframes p{50%{background:#5a0000}}
#falta{color:#f87171}
#emPausa{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 28px;background:#b45309;color:#fff;font-size:34px;font-weight:900;text-align:center}
td.nt{color:#f87171;font-weight:800}
</style></head><body>
<header><h1>Operação Brindes do Boni</h1><div id="relogio"></div></header>
<div id="pausa"></div>
<main>
 <div class="plats" id="plats"></div>
 <div class="kpis" id="kpis"></div>
 <div><div class="bar" id="barra"></div><p class="prev" id="prev">Calculando previsão…</p></div>
 <div><table id="canais"></table><p style="font-size:22px" id="falta"></p></div>
</main>
<div id="emPausa"></div>
<div id="cards" style="position:fixed;left:16px;bottom:16px;z-index:60;display:flex;flex-direction:column-reverse;gap:10px;width:min(720px,60vw)"></div>
<div id="somOff" style="display:none;position:fixed;right:16px;bottom:16px;z-index:61;background:#b45309;color:#fff;font-size:22px;font-weight:bold;padding:12px 18px;border-radius:12px;cursor:pointer">🔇 Clique aqui para ligar o som dos bipes</div>
<div id="alarme"><div>☕ HORA DO CAFÉ!</div><div id="alN" style="font-size:56px;margin-top:16px"></div></div>
<script>
const L=k=>{try{return localStorage.getItem(k)}catch(e){return null}},S=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let chave=L("chave");if(!chave){chave=prompt("Chave do posto:")||"";S("chave",chave)}
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const COR={AGUARDANDO:"#71717a",SEPARADO:"#0891b2",EM_GRAVACAO:"#d97706",GRAVADO:"#2563eb",EXPEDIDO:"#16a34a"};
const NOM={AGUARDANDO:"Aguardando",SEPARADO:"Separados",EM_GRAVACAO:"🔥 Gravando",GRAVADO:"✅ Gravados (esperando expedição)",EXPEDIDO:"Expedidos"};
async function carregar(){try{const r=await fetch("/api/operacao",{headers:{"X-Chave":chave}});
 if(r.status===403){S("chave","");return location.reload()}const d=await r.json(),c=d.contagem,t=d.total||1;
 $("kpis").innerHTML=`<div class="k" style="position:relative"><b>${d.total}</b>${d.anteriores?`<em style="position:absolute;top:10px;right:14px;font-style:normal;font-size:22px;color:#fbbf24">(${d.anteriores})</em>`:""}<span>Etiquetas de hoje${d.pedidos!=null?` <span style="display:block;font-size:18px">${d.pedidos} pedidos${d.upseller&&d.upseller.fresco?` · UpSeller: ${d.upseller.pedidos} em aberto`:""}</span>`:""}</span></div>`+Object.keys(NOM).map(k=>`<div class="k" style="border-left:8px solid ${COR[k]};position:relative"><b>${c[k]||0}</b><span>${NOM[k]}</span>${(d.anteriores_por||{})[k]?`<em style="position:absolute;top:10px;right:14px;font-style:normal;font-size:22px;color:#fbbf24">(${d.anteriores_por[k]})</em>`:""}${k=="GRAVADO"&&c[k]&&d.gravado_mais_antigo_min!=null?`<span style="display:block;font-size:18px;color:${d.gravado_mais_antigo_min>=20?"#f87171":"#fbbf24"}">mais antigo há ${d.gravado_mais_antigo_min} min</span>`:""}</div>`).join("")
  +(d.dia?`<div class="k" style="border-left:8px solid #22c55e;background:#12251a"><b>${d.dia.despachados}</b><span>🚚 Despachados hoje</span></div><div class="k" style="border-left:8px solid #7c3aed"><b>${d.dia.devolucoes}</b><span>↩ Devoluções hoje</span></div>`:"");
 $("barra").innerHTML=Object.keys(NOM).map(k=>`<div style="width:${100*c[k]/t}%;background:${COR[k]}"></div>`).join("");
 const R=d.ritmo,rit=["SEPARACAO","GRAVACAO","EXPEDICAO"].map(p=>R[p].por_hora?`${{SEPARACAO:"Separação",GRAVACAO:"Gravação",EXPEDICAO:"Expedição"}[p]}: ${R[p].por_hora}/h`:"").filter(Boolean).join(" · ");
 $("prev").innerHTML=d.previsao==="concluido"?"<b>✅ Tudo expedido!</b>":d.previsao?`Previsão de término: <b>${d.previsao}</b><br><span style="font-size:20px;color:#a1a1aa">${rit}</span>`:"Previsão aparece depois dos primeiros bipes";
 $("canais").innerHTML="<tr><th>Canal</th>"+Object.values(NOM).map(n=>`<th>${n}</th>`).join("")+"<th>Não tem</th></tr>"+Object.entries(d.por_canal).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td>`+Object.keys(NOM).map(s=>`<td>${v[s]}</td>`).join("")+`<td class="${v.FALTA?"nt":""}">${v.FALTA||0}</td></tr>`).join("");
const CP={"SHOPEE ENTREGA RÁPIDA":"#a855f7","SHOPEE EXPRESS":"#f97316","SHOPEE":"#fdba74","TIKTOK":"#22d3ee","OUTROS":"#71717a"};
 $("plats").innerHTML=(d.plataformas||[]).map(p=>`<div class="pl${p.total&&!p.faltam?" ok":""}" style="border-top-color:${CP[p.grupo]||"#555"}"><h3>${esc(p.grupo)}</h3><div class="lin"><b>${p.total&&!p.faltam?"✓":p.faltam}</b>${p.faltam?`<div class="tipos"><i class="p">✏️ ${p.personalizados||0} personalizados</i><i class="s">📦 ${p.sem_personalizar||0} sem personalizar</i></div>`:""}</div><span>${p.total&&!p.faltam?"tudo enviado":"a enviar"} · subiram ${p.total} · saíram ${p.enviados}</span></div>`).join("");
 OUVE=d.central_ouvindo===true;
 $("falta").textContent=d.falta_material?`⚠ ${d.falta_material} pedido(s) com falta de material`:"";
}catch(e){}}
// café
let P=[],ctx=null,tocou={};
function som(){try{ctx=ctx||new AudioContext();[[0,660,220],[.35,880,330],[.7,523,1047]].forEach(([d,a,b])=>{for(let i=0;i<30;i+=2){const o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime+i+d;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+.3);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.33)}})}catch(e){}}
async function pausas(){try{const r=await fetch("/api/pausas",{headers:{"X-Chave":chave}});if(r.ok)P=await r.json()}catch(e){}}
function tick(){const n=new Date();$("relogio").textContent=n.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
 const seg=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();let px=null,em=[];
 for(const p of P){const[h,m]=p.hora.split(":").map(Number),f=h*3600+m*60-seg,k=n.toDateString()+p.id;
  if(f<=0&&f>-5&&!tocou[k]){tocou[k]=1;$("alN").textContent=p.pessoas;$("alarme").classList.add("on");som();setTimeout(()=>$("alarme").classList.remove("on"),30000)}
  const resta=f+(p.duracao||15)*60;if(f<=0&&resta>0)em.push(`☕ ${p.pessoas} em pausa — volta em ${Math.floor(resta/60)}:${String(resta%60).padStart(2,"0")}`);
  if(f>0&&f<=3600&&(!px||f<px.f))px={...p,f}}
 const ep=$("emPausa");ep.style.display=em.length?"block":"none";ep.innerHTML=em.map(esc).join("<br>");
 const e=$("pausa");if(!px){e.style.display="none";return}e.style.display="block";
 e.textContent=`☕ ${px.nome} — ${px.pessoas} em ${Math.floor(px.f/60)}:${String(px.f%60).padStart(2,"0")}`}
document.addEventListener("click",()=>{try{ctx=ctx||new AudioContext();ctx.resume()}catch(e){}},{once:true});
carregar();setInterval(carregar,2000);pausas();setInterval(pausas,300000);setInterval(tick,1000);tick();

// ---- bipes feitos nos computadores dos colaboradores: aparecem e tocam aqui na TV da central
const VBASE=[523,587,659,698,784,880,988,1047],VOK=[[[0,90],[4,90],[7,170]],[[0,120],[null,40],[12,220]],[[7,80],[4,80],[7,80],[12,200]],[[0,60],[2,60],[4,60],[5,60],[7,200]],[[12,110],[7,110],[12,220]],[[0,90],[7,90],[0,90],[7,200]],[[4,140],[9,260]],[[0,70],[null,30],[0,70],[null,30],[12,220]]],VAV=[[[-5,130],[null,60],[-5,130]],[[-3,160],[-8,220]],[[-5,80],[null,50],[-5,80],[null,50],[-5,80]],[[-8,220],[-5,140]],[[-2,120],[null,50],[-7,200]],[[-5,100],[-4,100],[-5,200]],[[-10,180],[null,60],[-10,180]],[[-7,90],[-3,90],[-7,180]]],VER=[[[-12,220],[-17,220],[-12,220],[-17,220],[-24,550]],[[-12,130],[null,50],[-12,130],[null,50],[-12,130],[null,50],[-24,600]],[[-10,150],[-22,150],[-10,150],[-22,150],[-10,150],[-22,150],[-29,400]],[[-12,90],[-13,90],[-12,90],[-13,90],[-12,90],[-13,90],[-12,90],[-13,90],[-24,400]],[[-7,300],[-19,600]],[[-17,120],[null,40],[-17,120],[null,40],[-17,120],[null,40],[-17,120],[null,40],[-17,120]],[[-12,180],[-15,180],[-18,180],[-24,500]],[[-14,250],[-12,250],[-14,250],[-24,500]]];
function vozInfo(v){v=((v|0)%16+16)%16;return {m:v%8,t:Math.floor(v/8),b:VBASE[(v+Math.floor(v/8)*4)%8]}}
function tonsVoz(v,tipo){const i=vozInfo(v),M=(tipo==="ok"?VOK:tipo==="aviso"?VAV:VER)[i.m];
 return M.map(([s,d])=>[s===null?0:Math.round(i.b*Math.pow(2,s/12)),d])}
function timbreVoz(v,tipo){return tipo==="erro"?"square":vozInfo(v).t?"sawtooth":"triangle"}
let AC=null;function tocarVoz(v,tipo){try{AC=AC||new AudioContext();AC.resume();let t=AC.currentTime+.02;
 for(const [f,ms] of tonsVoz(v,tipo)){const d=ms/1000;if(f){const o=AC.createOscillator(),g=AC.createGain();o.type=timbreVoz(v,tipo);o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  const vol=tipo==="erro"?.6:o.type==="sawtooth"?.25:.4;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol,t+d-.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.01)}t+=d}}catch(e){}}
let OUVE=false,FD=null;
const CORC={ok:"#15803d",aviso:"#b45309",erro:"#b91c1c",operador:"#1d4ed8"};
function cardBipe(b){const it=b.item||{},tipo=CORC[b.tipo]?b.tipo:"erro";const el=document.createElement("div");
 el.style.cssText=`background:${CORC[tipo]};color:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 6px 24px #0008;font-size:22px`;
 el.innerHTML=`<div style="font-size:17px;opacity:.9;font-weight:bold">💻 ${esc((b.colaborador||"SEM OPERADOR").toUpperCase())} · ${esc(b.posto||"")} · ${esc(b.em||"")}</div><div style="font-size:30px;font-weight:900;margin:2px 0">${esc(b.msg||"")}</div>`+
  (b.item?`<div style="font-size:19px">SKU ${esc(it.sku)}${it.cor?" · "+esc(it.cor):""}${it.nomes?` · Nome: <b>${esc(it.nomes)}</b>`:""}${it.pedido?" · Pedido "+esc(it.pedido):""}</div>`:"")+(b.fazer?`<div style="font-size:19px;margin-top:4px">👉 ${esc(b.fazer)}</div>`:"");
 const c=$("cards");c.prepend(el);while(c.children.length>4)c.lastChild.remove();setTimeout(()=>el.remove(),b.tipo==="erro"?12000:6000);
 tocarVoz(b.voz??0,tipo==="operador"?"ok":tipo)}
async function feed(){try{const r=await fetch("/api/bipes/meus?op=TODOS&tv=1"+(FD!=null?"&desde="+FD:""),{headers:{"X-Chave":chave}});if(!r.ok)return;const d=await r.json();
 if(FD!=null&&!OUVE)(d.bipes||[]).filter(b=>b.origem==="pc"||(!b.origem&&!b.leitor)).forEach(cardBipe);FD=d.ultimo}catch(e){}
 try{$("somOff").style.display=(!AC||AC.state!=="running")?"block":"none"}catch(e){}}
$("somOff").onclick=()=>{try{AC=AC||new AudioContext();AC.resume().then(()=>{$("somOff").style.display="none";tocarVoz(0,"ok")})}catch(e){}};
document.addEventListener("click",()=>{try{AC=AC||new AudioContext();AC.resume()}catch(e){}});
setInterval(feed,1000);feed();
</script></body></html>

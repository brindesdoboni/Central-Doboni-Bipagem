<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contagem - Central Boni</title>
<style>
body{font:16px Arial,sans-serif;margin:0;background:#f4f4f5;color:#111}
header{position:sticky;top:0;background:#1d4ed8;color:#fff;padding:10px 12px;z-index:2}
header h1{font-size:18px;margin:0 0 6px}
header select,header input{font-size:16px;padding:6px;border-radius:6px;border:0;width:100%;box-sizing:border-box;margin-top:4px}
.lin{display:flex;align-items:center;gap:8px;background:#fff;margin:6px 8px;padding:8px 10px;border-radius:8px;border-left:5px solid #d4d4d8}
.lin.ok{border-left-color:#16a34a}.lin.dif{border-left-color:#f59e0b}
.lin .t{flex:1;min-width:0}.lin b{font-size:17px}.lin .c{font-size:15px}.lin .s{font-size:12px;color:#888}
.lin input{width:84px;font-size:22px;padding:6px;text-align:center;border:2px solid #999;border-radius:8px}
.g{margin:14px 10px 2px;font-weight:bold;color:#555}
footer{position:sticky;bottom:0;background:#fff;padding:10px;border-top:1px solid #ddd;display:flex;gap:8px;align-items:center}
footer button{flex:1;font-size:18px;padding:12px;border:0;border-radius:8px;background:#16a34a;color:#fff;font-weight:bold}
#msg{font-size:14px}
label{font-size:14px}
</style></head><body>
<header><h1>📦 Contagem de estoque</h1>
<select id="prat" onchange="render()"></select>
<input id="busca" placeholder="Procurar SKU ou cor" oninput="render()">
<label><input type="checkbox" id="verSis" onchange="render()" style="width:auto"> mostrar saldo do sistema</label></header>
<div id="lista"></div>
<footer><span id="msg"></span><button onclick="salvar()">Salvar contados</button></footer>
<script>
let IT=[];const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chave=i=>i.sku+"|"+i.cor;
let RASC={};try{RASC=JSON.parse(localStorage.getItem("cont_rasc")||"{}")}catch(e){}
function guarda(){try{localStorage.setItem("cont_rasc",JSON.stringify(RASC))}catch(e){}}
function ordem(p){if(!p)return[1,[]];return[0,(p.toUpperCase().match(/\d+|[A-Z]+/g)||[]).map(t=>/\d/.test(t)?[0,+t,""]:[1,0,t])]}
function cmp(a,b){const pa=ordem(a.prateleira),pb=ordem(b.prateleira);if(pa[0]!=pb[0])return pa[0]-pb[0];
 for(let k=0;k<Math.max(pa[1].length,pb[1].length);k++){const u=pa[1][k],v=pb[1][k];if(!u)return -1;if(!v)return 1;
  if(u[0]!=v[0])return u[0]-v[0];if(u[1]!=v[1])return u[1]-v[1];if(u[2]!=v[2])return u[2]<v[2]?-1:1}
 return a.sku<b.sku?-1:a.sku>b.sku?1:(a.cor<b.cor?-1:a.cor>b.cor?1:0)}
async function carregar(){const r=await fetch("/api/estoque");if(r.status==401){location.reload();return}
 const d=await r.json();IT=d.itens.filter(i=>!(i.sem_cor&&!i.fisico)).sort(cmp);
 const ps=[...new Set(IT.map(i=>i.prateleira||""))];const sel=$("prat").value;
 $("prat").innerHTML='<option value="*">Todas as prateleiras</option>'+ps.map(p=>`<option value="${esc(p)}">${p?"Prateleira "+esc(p):"Sem prateleira"}</option>`).join("");
 if(sel)$("prat").value=sel;render()}
function render(){const p=$("prat").value,f=($("busca").value||"").toUpperCase(),vs=$("verSis").checked;let at=null,h="";
 IT.filter(i=>(p=="*"||(i.prateleira||"")==p)&&(!f||(i.sku+" "+i.cor).toUpperCase().includes(f))).forEach(i=>{
  if((i.prateleira||"")!==at){at=i.prateleira||"";h+=`<div class="g">${at?"Prateleira "+esc(at):"Sem prateleira"}</div>`}
  const k=chave(i),v=RASC[k]??"";const cls=v===""?"":(+v==i.fisico?"ok":"dif");
  h+=`<div class="lin ${cls}"><div class="t"><b>${esc(i.sku)}</b> <span class="c">${esc(i.cor)}</span><div class="s">${esc((i.nome||"").slice(0,40))}${vs?" · sistema: "+i.fisico:""}</div></div>
  <input inputmode="numeric" pattern="[0-9]*" value="${esc(v)}" data-k="${esc(k)}" oninput="digita(this)" onkeydown="if(event.key=='Enter'){event.preventDefault();proximo(this)}"></div>`});
 $("lista").innerHTML=h||'<p style="padding:12px">Nada aqui.</p>';conta()}
function digita(el){const v=el.value.replace(/[^\d]/g,"");el.value=v;if(v==="")delete RASC[el.dataset.k];else RASC[el.dataset.k]=v;guarda();
 const i=IT.find(x=>chave(x)==el.dataset.k);el.parentNode.className="lin "+(v===""?"":(+v==i.fisico?"ok":"dif"));conta()}
function proximo(el){const t=[...document.querySelectorAll(".lin input")];const n=t[t.indexOf(el)+1];if(n){n.focus();n.scrollIntoView({block:"center"})}}
function conta(){const n=Object.keys(RASC).length;if(n)$("msg").textContent=n+" contado(s) para salvar"}
async function salvar(){const ks=Object.keys(RASC);if(!ks.length){$("msg").textContent="Nada digitado ainda";return}
 const texto=ks.map(k=>{const[s,c]=k.split("|");return s+";"+c+";"+RASC[k]}).join("\n");
 $("msg").textContent="Salvando...";
 try{const r=await fetch("/api/estoque/contagem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({texto})});
  if(r.status==401){$("msg").textContent="Entre de novo (login expirou) — o que digitou continua guardado";return}
  const d=await r.json();if(!d.ok)throw 0;RASC={};guarda();$("msg").textContent="✅ "+d.feitos+" salvos"+(d.erros.length?" · erro: "+d.erros.join(", "):"");carregar()}
 catch(e){$("msg").textContent="❌ Não salvou (sem internet?) — o que digitou continua guardado, tente de novo"}}
carregar();
</script></body></html>

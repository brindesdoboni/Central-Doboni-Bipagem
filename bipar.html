<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bipagem - Central Boni</title>
<style>
:root{--ok:#1f9d55;--av:#d99a00;--er:#d7263d;--bg:#111;--fg:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#222;font-size:20px}
#posto{font-weight:800;font-size:26px;letter-spacing:1px}#op{font-size:22px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:background .2s}
#quem{font-size:40px;font-weight:900;margin-bottom:14px;padding:6px 22px;border-radius:10px;background:rgba(0,0,0,.35);display:none}
#msg{font-size:56px;font-weight:800;max-width:95vw}#det{font-size:28px;margin-top:18px;opacity:.95;line-height:1.4}
#modo{margin-top:16px;font-size:24px;padding:8px 18px;border-radius:8px;background:var(--av);color:#000;display:none}
input{position:absolute;opacity:0;left:-999px}
.escolha{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(700px,95vw)}
.escolha button{font-size:28px;padding:30px;border:0;border-radius:12px;background:#333;color:#fff;cursor:pointer}
footer{padding:10px 20px;background:#222;font-size:16px;opacity:.8;display:flex;justify-content:space-between}
a{color:#aaa}
#pausa{display:none;padding:10px 20px;background:#3b2f00;color:#ffd84d;font-size:24px;font-weight:700;text-align:center}
#emPausa{display:none;padding:12px 20px;background:#b45309;color:#fff;font-size:28px;font-weight:900;text-align:center}
#alarme{display:none;position:fixed;inset:0;z-index:9;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:64px;font-weight:900;color:#fff;background:#d7263d}
#alarme.on{display:flex;animation:pisca .5s steps(1) infinite}@keyframes pisca{50%{background:#5a0000}}
</style></head><body>
<header><div id="posto">-</div><div id="op">Bipe seu CRACHÁ</div></header>
<div id="pausa"></div><div id="alarme"><div>☕ HORA DO CAFÉ!</div><div id="alNomes" style="font-size:48px;margin-top:16px"></div></div>
<main id="tela"><div id="quem"></div><div id="msg">Carregando…</div><div id="det"></div><div id="modo">MODO NÃO TEM (contínuo) — bipe as etiquetas; para sair bipe o setor ou NÃO TEM de novo</div></main>
<div id="emPausa"></div><footer><span>Códigos especiais: <b>CMD-FALTA</b> (falta material) · <b>CMD-DESFAZER</b> (desfaz o último bipe) · bipe o código do posto para trocar</span><a href="#" onclick="trocarPosto()">trocar posto</a></footer>
<input id="in" autocomplete="off">
<script>
const POSTOS={SEPARACAO:"SEPARAÇÃO",GRAVACAO:"GRAVAÇÃO",EXPEDICAO:"EXPEDIÇÃO",DEVOLUCAO:"DEVOLUÇÃO"};
const L=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, S=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let posto=L("posto"), chave=L("chave"), op=null, modo=null, tOp=null;
const $=id=>document.getElementById(id), inp=$("in");
function beep(ok){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
 o.frequency.value=ok?880:220;g.gain.value=.3;o.start();o.stop(a.currentTime+(ok?.12:.5))}catch(e){}}
function tela(tipo,msg,det){const cor={ok:"var(--ok)",aviso:"var(--av)",erro:"var(--er)",operador:"#1d4ed8"}[tipo]||"var(--bg)";
 $("tela").style.background=cor;$("msg").textContent=msg;
 const q=$("quem");q.style.display=tipo?"inline-block":"none";q.textContent=op?"👤 "+op.nome:"👤 SEM CRACHÁ";$("det").innerHTML=det||"";beep(tipo==="ok"||tipo==="operador");
 clearTimeout(tela.t);tela.t=setTimeout(()=>{$("tela").style.background="var(--bg)";$("quem").style.display="none"},tipo==="erro"?4000:1500)}
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function trocarPosto(){S("posto","");location.reload()}
function escolherPosto(){ $("msg").textContent="Qual é este posto?";
 $("det").innerHTML='<div class="escolha">'+Object.entries(POSTOS).map(([k,v])=>`<button onclick="S('posto','${k}');location.reload()">${v}</button>`).join("")+"</div>"}
function pronto(){ $("posto").textContent=POSTOS[posto]; $("msg").textContent="Bipe seu CRACHÁ"; $("det").textContent="";
 setInterval(()=>{if(document.activeElement!==inp)inp.focus()},500)}
function sairOp(){op=null;$("op").textContent="Bipe seu CRACHÁ"}
async function enviar(codigo){
 const c=codigo.trim().toUpperCase(); if(!c)return;
 const cmd=c.replace(/[^A-Z]/g,"");
 if(["CMDSEPARACAO","CMDGRAVACAO","CMDEXPEDICAO","CMDDEVOLUCAO"].includes(cmd)){posto=cmd.slice(3);S("posto",posto);
   $("posto").textContent=POSTOS[posto];modo=null;$("modo").style.display="none";
   return tela("operador","Posto: "+POSTOS[posto],op?"Operador: "+esc(op.nome):"Bipe seu CRACHÁ")}
 if(c.replace(/[^A-Z]/g,"")==="CMDFALTA"){ if(!op)return tela("erro","Bipe o seu CRACHÁ primeiro.");
   if(modo==="FALTA"){modo=null;$("modo").style.display="none";return tela("ok","Modo NÃO TEM desligado","Voltou ao normal")}
   modo="FALTA";$("modo").style.display="block";return tela("aviso","Modo NÃO TEM ligado","Bipe todas as etiquetas que não tem. Para sair: bipe o setor ou NÃO TEM de novo.")}
 try{const r=await fetch("/api/bipe",{method:"POST",headers:{"Content-Type":"application/json","X-Chave":chave},
   body:JSON.stringify({posto,codigo:c,operador:op&&op.codigo,modo})});const d=await r.json();
  if(r.status===403){S("chave","");chave=null;return tela("erro","Chave do posto inválida","Recarregue a página e digite a chave")}
  if(d.tipo==="operador"){op=d.operador;$("op").textContent="👤 "+op.nome}
  const i=d.item;let det="";
  if(i)det=`Etiqueta <b>${esc(i.etiqueta||"-")}</b> · Pedido ${esc(i.pedido)} · ${esc(i.canal)}<br>${esc(i.sku)} ${esc(i.cor)}`+
    (i.nomes?`<br>Nome: <b>${esc(i.nomes)}</b>`+(i.fonte?` · Fonte: <b>${esc(i.fonte)}</b>`:""):"");
  tela(d.tipo,d.msg,det);
  clearTimeout(tOp);tOp=setTimeout(sairOp,20*60*1000);
 }catch(e){tela("erro","Sem conexão","Verifique a internet e bipe de novo")}}
// ---------- pausas (café) ----------
let PAUSAS=[],ctx=null,tocadas={};
function audio(){try{ctx=ctx||new AudioContext();if(ctx.state==="suspended")ctx.resume()}catch(e){}return ctx}
function boing(t0){const a=audio();if(!a)return;[[0,660,220],[.35,880,330],[.7,523,1047],[1.1,1047,262]].forEach(([d,f1,f2])=>{
 const o=a.createOscillator(),g=a.createGain();o.type="square";o.connect(g);g.connect(a.destination);const t=a.currentTime+t0+d;
 o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+.3);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.33)})}
function alarme(p){$("alNomes").textContent=p.pessoas;$("alarme").classList.add("on");for(let i=0;i<30;i+=2)boing(i);
 setTimeout(()=>$("alarme").classList.remove("on"),30000)}
async function carregarPausas(){try{const r=await fetch("/api/pausas",{headers:{"X-Chave":chave}});if(r.ok)PAUSAS=await r.json()}catch(e){}}
function tickPausas(){const n=new Date(),hoje=n.toDateString(),seg=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();let prox=null,em=[];
 for(const p of PAUSAS){const [h,m]=p.hora.split(":").map(Number),alvo=h*3600+m*60,falta=alvo-seg,k=hoje+p.id;
  if(falta<=0&&falta>-5&&!tocadas[k]){tocadas[k]=1;alarme(p)}
  const resta=falta+(p.duracao||15)*60;if(falta<=0&&resta>0)em.push(`☕ ${p.pessoas} em pausa — volta em ${Math.floor(resta/60)}:${String(resta%60).padStart(2,"0")}`);
  if(falta>0&&falta<=3600&&(!prox||falta<prox.falta))prox={...p,falta}}
 const ep=$("emPausa");ep.style.display=em.length?"block":"none";ep.innerHTML=em.map(esc).join("<br>");
 const el=$("pausa");if(!prox){el.style.display="none";return}
 const mm=Math.floor(prox.falta/60),ss=String(prox.falta%60).padStart(2,"0");
 el.style.display="block";el.textContent=`☕ ${prox.nome} — ${prox.pessoas} em ${mm}:${ss}`}
document.addEventListener("keydown",audio,{once:true});document.addEventListener("click",audio,{once:true});
carregarPausas();setInterval(carregarPausas,5*60*1000);setInterval(tickPausas,1000);
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){enviar(inp.value);inp.value=""}});
if(!chave){chave=prompt("Chave do posto (fornecida pelo Lucas):")||"";S("chave",chave)}
if(!posto||!POSTOS[posto])escolherPosto();else pronto();
</script></body></html>

<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Boni</title>
<style>body{font-family:system-ui,Arial;background:#f4f4f5;display:flex;height:100vh;align-items:center;justify-content:center;margin:0}
form{background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 12px #0002;width:320px}input,button{width:100%;padding:12px;margin-top:12px;font-size:16px;border-radius:8px;border:1px solid #ccc}
button{background:#111;color:#fff;border:0;cursor:pointer}#e{color:#c00;margin-top:8px}</style></head><body>
<form onsubmit="entrar(event)"><h2>Central Boni</h2><input id="s" type="password" placeholder="Senha" autofocus><button>Entrar</button><div id="e"></div></form>
<script>async function entrar(ev){ev.preventDefault();const r=await fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({senha:s.value})});
if(r.ok)location.reload();else e.textContent="Senha incorreta"}</script></body></html>
